services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/tutien.db
      Database__Provider: Sqlite
      Jwt__Key: ${JWT_KEY:-dev-only-change-me-tutien-du-hanh-32ch!}
    volumes:
      - tutien-data:/data
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - api
volumes:
  tutien-data:
